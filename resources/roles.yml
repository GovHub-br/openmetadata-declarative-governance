# Roles. Cada uma junta policies; quem recebe a role e o time (papeis_padrao,
# herdado por todos os membros) ou o usuario (papeis).
#
# Roles embutidas (DataConsumer, DataSteward, as dos bots) e as de outros
# repositorios nao sao declaradas aqui.

roles:
  - nome: GovernancaComoCodigoRole
    nome_exibicao: Governança como código
    descricao: Role do bot que aplica o repositório de governança declarativa.
    politicas:
      - GovernancaComoCodigoPolicy

  # Dada pelos times de consumidores (mcid-consumidores, minc-consumidores):
  # o dominio vem do time e do usuario, a regra e a mesma para todos.
  - nome: ConsumidorDominioRole
    nome_exibicao: Consumidor do domínio
    descricao: Perfil de consumo por domínio, leitura e sugestão por Task.
    politicas:
      - ConsumidorDominioPolicy
